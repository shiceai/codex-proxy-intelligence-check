name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
  build:
    needs: check
    # 在较旧的系统上构建，安装包只依赖 glibc 2.34 及以上
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUST_MIN_STACK: 16777216
      PLUGIN_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Validate plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const versions = [require("./plugin.json").version, require("./frontend/package.json").version];
            if (versions.some(v => process.env.RELEASE_TAG !== "v" + v)) throw new Error("Tag must match plugin.json and frontend/package.json: " + versions.join(", "));
          '
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: ${{ env.PLUGIN_TARGET }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend -> target
      - name: Install pinned package tool
        run: cargo install --locked --git https://github.com/zyycn/codex-proxy-rs.git --rev 8c8618aa0f841638262262e3338c115bc075f125 codex-proxy-plugin-cli
      - name: Build installable package
        run: bash scripts/package "$PLUGIN_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-${{ env.PLUGIN_TARGET }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG"
          notes="安装方法与版本变化见 [README]($base/README.md)，安装前用 \`.sha256\` 文件核对安装包。

          See the [English README]($base/README.en.md) for installation and changes. Verify the package against its \`.sha256\` file before installing."
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "模型智力检测 $RELEASE_TAG" \
            --notes "$notes"
